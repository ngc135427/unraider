name: unraider
description: A Flutter implementation of the Unraid mobile prototype pages.
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  audio_session: ^0.2.4
  dartssh2: ^2.21.0
  flutter:
    sdk: flutter
  http: ^1.2.2
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  video_player: ^2.13.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/pdfjs/viewer.html
    - assets/pdfjs/pdf.min.js
    - assets/pdfjs/pdf.worker.min.js
